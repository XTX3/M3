      --main: #fff;

    body { margin: 0; font-family:'Almarai',sans-serif; background: var(--bg); min-height:100vh; }

    .summary-card {
      background:linear-gradient(95deg,#fff9fc 60%,#f3e8ff 120%);
      border-radius:var(--radius);padding:15px 7px;font-weight:700;box-shadow:0 2px 8px #d9c3ee36;text-align:center;

    }
    .summary-card span {display:block;font-size:1.28rem;color:var(--prim);font-weight:bold;}
    @media(max-width:690px){.container{padding:3px;}.summary{grid-template-columns:repeat(2,1fr);}}
    @media(max-width:430px){.summary-card{font-size:.93em;padding:8px 2px;}.main-topbar{flex-direction:column;align-items:flex-start;gap:8px;}}
    .nav-tabs {display:flex; gap:9px;margin:12px 0 20px 0;}
    .nav-tabs button {
      flex:1 1 0;background:#ede9fe;color:var(--prim);

    .section-content {background:#fff;border-radius:0 0 var(--radius) var(--radius);box-shadow:0 2px 11px #ede9fe35;padding:11px 5px;}
    .card {
      background:#fbf9ff;border-radius:10px;box-shadow:0 1px 7px #ede9fe33;

      border:1px solid #f3e8ff;
    }

    .card .grid{display:grid;gap:7px 3px;grid-template-columns:repeat(2,1fr);}
    .card ul{margin:7px 0 0 0;padding-right:19px;}
    .card ul li{font-size:.95em;}
    .actions{display:flex;gap:7px;}
    .btn {border:none;border-radius:7px;padding:6px 13px;font-weight:700;cursor:pointer;}
    .btn-approve{background: var(--success);color:#fff;}
    .btn-reject{background: var(--danger);color:#fff;}

    if(!list.length){listDiv.innerHTML = "<div>لا توجد سجلات.</div>"; return;}

      const acc=d.accessories?.length?`<ul>${d.accessories.map(a=> `<li>${a.type} – ${a.price} ر.س</li>`).join("")}</ul>`:"<span>لا يوجد</span>";
      const c = document.createElement("div");

      c.querySelector('.btn-approve').onclick = ()=>confirmApprove(d.id);
      c.querySelector('.btn-reject').onclick = ()=>confirmReject(d.id);
      listDiv.appendChild(c);
    });
  }
  onSnapshot(query(collection(db,"purchases"),where("status","==","pending_verification")), snap=>{
    records = [];
    snap.forEach(ds=>{const d=ds.data();d.id=ds.id;records.push(d);});
    draw(records);

  searchInput.oninput = ()=> {
    const v = searchInput.value.trim().toLowerCase();

// الأرشيف
function renderArchiveSection(){
  archiveSection.innerHTML = `<button id="archiveBtn" class="btn btn-ghost" style="margin-bottom:12px;">📦 أرشفة مبيعات اليوم</button>
  <div class="small" style="margin-bottom:9px;">يمكنك تحميل بيانات أي يوم أرشفته سابقاً</div>
  <div class="archive-list" id="archiveList"></div>`;
  const archiveBtn = document.getElementById("archiveBtn"),
        archiveListDiv = document.getElementById("archiveList");
  // تحميل قائمة الأرشيف
  async function loadArchiveList(){
    archiveListDiv.textContent = "جاري التحميل...";
    const snap = await getDocs(collection(db,"archive"));
    let days = [];
    for(const ds of snap.docs){
      let summarySnap = await getDocs(collection(ds.ref,"data"));
      let summaryDoc = null;
      summarySnap.forEach(doc_=>{if(doc_.data().type==="summary") summaryDoc=doc_.data();});
      days.push({id:ds.id, summary:summaryDoc});
    }
    archiveListDiv.innerHTML = (days.length === 0)?"<div>لا يوجد أرشيف بعد.</div>":
    days.sort((a,b)=>b.id.localeCompare(a.id)).map(day=>
      `<div class="archive-item">
        <div><b>التاريخ:</b> ${day.summary?.date||"-"} <b>الوقت:</b> ${day.summary?.time||"<span>-</span>"}<br>
        <span class="small">📱 ${day.summary?.deviceCount??0} | 🎧 ${day.summary?.accCount??0} | 💰 ${day.summary?.total??0} ر.س</span></div>
        <button onclick="downloadArchive('${day.id}')">تحميل</button>
      </div>`
    ).join("");
  }
  loadArchiveList();
  // الأرشفة
  archiveBtn.onclick = async ()=>{
    archiveBtn.disabled=true;archiveBtn.textContent="⏳ أرشفة ...";
    // جلب السجلات الحالية
    const now=new Date(),dayStr=now.toISOString().substring(0,10),timeStr=now.toLocaleTimeString('ar-EG',{hour12:false}),
          archiveId=`${dayStr}_${timeStr.replace(/:/g,'-')}`;
    const colRef=collection(db,"purchases"),q=query(colRef),snap=await getDocs(q);
    let allToday=[], stats={approved:[],rejected:[],pending:[],todayTotal:0,deviceCount:0,accCount:0};
    snap.forEach(ds=>{
      const d=ds.data();d.id=ds.id;allToday.push(d);
      if(d.status==="approved"){stats.approved.push(d);stats.todayTotal+=parseFloat(d.price)||0;stats.deviceCount++;stats.accCount+=Array.isArray(d.accessories)?d.accessories.length:0;}
      else if(d.status==="rejected"){stats.rejected.push(d);}
      else if(d.status==="pending_verification"){stats.pending.push(d);}
    });
    if(allToday.length===0){showToast("لا يوجد بيانات للأرشفة","warn"); archiveBtn.disabled=false;archiveBtn.textContent="📦 أرشفة مبيعات اليوم";await loadArchiveList();return;}
    const archRef=doc(db,"archive",archiveId);
    await addDoc(collection(archRef,"data"),{type:"summary",date:dayStr,time:timeStr,total:stats.todayTotal,deviceCount:stats.deviceCount,accCount:stats.accCount,archivedAt:new Date()});
    for(const cat of ["approved","rejected","pending"]) for(const r of stats[cat]) await addDoc(collection(archRef,cat),r);
    for(const d of allToday) await updateDoc(doc(db,"purchases",d.id),{status:"archived"});
    showToast("تمت الأرشفة بنجاح");
    archiveBtn.disabled=false;archiveBtn.textContent="📦 أرشفة مبيعات اليوم";
    await loadArchiveList(); loadSummary();
  };
}
// تحميل الأرشيف كملف csv
window.downloadArchive = async function(archiveId){
  showToast("تحميل الأرشيف ... " + archiveId,"info");
  const archRef = doc(db,"archive",archiveId);
  let content = `الهاتف,الرام,الذاكرة,السعر,الحالة,المسؤول,الإكسسوارات\n`;
  for(const cat of ["approved","rejected","pending"]){
    const snap=await getDocs(collection(archRef,cat));
    snap.forEach(ds=>{
      const r=ds.data();
      let acc=(r.accessories||[]).map(a=>`${a.type}-${a.price}`).join("|");
      content += `${r.phoneName||""},${r.ram||""},${r.storage||""},${r.price||""},${r.status||""},${r.createdByEmail||""},${acc}\n`;
    });
  }
  const summarySnap=await getDocs(collection(archRef,"data"));
  summarySnap.forEach(doc_=>{
    const d = doc_.data();
    if(d.type==="summary"){
      content += `\nملخص اليوم,${d.date} ${d.time}\nالأجهزة:${d.deviceCount},الإكسسوارات:${d.accCount},المجموع:${d.total}\n`;
    }
  });
  downloadFile(content,`archive-${archiveId}.csv`);
};
// ------------ عمليات القبول والرفض --------------
async function confirmApprove(id){
  if(!confirm("تأكيد الموافقة؟"))return;
  await updateDoc(doc(db,"purchases",id),{status:"approved",approvedAt:serverTimestamp()});
  showToast("تمت الموافقة بنجاح");
}
async function confirmReject(id){
  if(!confirm("تأكيد الرفض؟"))return;
  await updateDoc(doc(db,"purchases",id),{status:"rejected"});
  showToast("تم الرفض");
}
// ----------- ملخص الأرقام --------
function loadSummary(){
  // الأجهزة/الملحقات/الكلي/اليوم
  onSnapshot(query(collection(db,"purchases")), snap=>{
    let dev=0,acc=0,cnt=0;
    const today=new Date(); today.setHours(0,0,0,0);
    snap.forEach(ds=>{
      const d=ds.data();
      if(d.status==="approved"){dev+=parseFloat(d.price)||0;if(Array.isArray(d.accessories))acc+=d.accessories.reduce((a,x)=>a+(parseFloat(x.price)||0),0);}
      if(d.status==="approved"&&d.approvedAt){const dt=d.approvedAt.toDate?d.approvedAt.toDate():new Date(d.approvedAt);if(dt>=today)cnt++;}
    });
    sumDevicesEl.textContent = formatSAR(dev);
    sumAccessoriesEl.textContent = formatSAR(acc);
    sumTotalEl.textContent = formatSAR(dev+acc);
    countTodayEl.textContent = cnt;
  });
}

function loadChart(){
  onSnapshot(query(collection(db,"purchases")), snap=>{
    // التحليل: حصر الأيام الحالية 
    const today=new Date(),start=new Date(today.getFullYear(),today.getMonth(),1);
    let days={};
    for(let d=new Date(start);d<=today;d.setDate(d.getDate()+1)){
      const key=d.toISOString().substring(0,10);
      days[key]={devices:0,total:0};
    }
    let phoneCount={}, accCount={};
    snap.forEach(ds=>{
      const data=ds.data();
      if(data.status!=="approved"||!data.approvedAt)return;
      const d_=data.approvedAt.toDate?data.approvedAt.toDate():new Date(data.approvedAt);
      const key=d_.toISOString().substring(0,10);
      if(days[key]){
        days[key].devices+=1;
        let accessoriesTotal=0;
        if(Array.isArray(data.accessories)){
          accessoriesTotal = data.accessories.reduce((a,x)=>a+(parseFloat(x.price)||0),0);
          data.accessories.forEach(x=>{accCount[x.type]=(accCount[x.type]||0)+1;});
        }
        days[key].total+=(parseFloat(data.price)||0)+accessoriesTotal;
        phoneCount[data.phoneName]=(phoneCount[data.phoneName]||0)+1;
      }
    });
    // بيانات الرسم
    const labels=Object.keys(days);
    const deviceCounts=labels.map(k=>days[k].devices),totalCounts=labels.map(k=>days[k].total);
    topPhone.textContent = "الأكثر مبيعاً: "+(Object.entries(phoneCount).sort((a,b)=>b[1]-a[1])[0]?.[0]||"-");
    topAcc.textContent = "الإكسسوار الأكثر: "+(Object.entries(accCount).sort((a,b)=>b[1]-a[1])[0]?.[0]||"-");
    // رسم (تحديث)
    if(chartIns) chartIns.destroy();
    chartIns = new Chart(document.getElementById("salesChart").getContext("2d"),{
      type:'line',
      data:{labels:labels,
        datasets:[
          {label:"عدد الأجهزة",data:deviceCounts,borderColor:"#f472b6",backgroundColor:"rgba(244,114,182,.11)",borderWidth:2.3,tension:.28,fill:true,pointRadius:4,pointHoverRadius:8},
          {label:"إجمالي المبيعات (ر.س)",data:totalCounts,borderColor:"#8b5cf6",backgroundColor:"rgba(139,92,246,.13)",borderWidth:2.2,borderDash:[9,7],tension:.22,fill:true,pointRadius:3,pointHoverRadius:6}
        ]
      },
      options:{
        responsive:true,
        plugins:{legend:{position:'top',labels:{font:{family:"Almarai",size:13}}}},
        scales:{y:{beginAtZero:true,ticks:{font:{family:"Almarai",size:12}}},x:{ticks:{font:{family:"Almarai",size:11}}}}
      }
    });
  });
}

function downloadFile(content,filename){
  const blob=new Blob([content],{type:'text/csv'}),url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=filename;a.click();a.remove();URL.revokeObjectURL(url);showToast("تم التحميل");
}
